name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK Licenses and Keystore
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          
          # 赋予 runner 用户 SDK 目录完整写权限，避免 Permission denied
          sudo chown -R $USER:$USER "$SDK_DIR" 2>/dev/null || true
          mkdir -p "$SDK_DIR/licenses"
          
          # 自动注入官方 Android SDK 协议
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          echo "84831b9409646a246e0444224b33ea007077259b" >> "$SDK_DIR/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_DIR/licenses/android-sdk-license"

          # 配置 SDK 路径与环境变量文件
          echo "sdk.dir=$SDK_DIR" > local.properties
          touch .env
          echo "APP_NAME=SmartTodo" >> .env

          # 自动生成 debug.keystore 证书
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug -x test --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTodo-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
